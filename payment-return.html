<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171316"><title>Payment confirmation | Cee Beauty</title><link rel="stylesheet" href="style.css"><style>main{max-width:680px;margin:10vh auto;padding:28px}.result{background:#fbf2f6;border-radius:14px;padding:24px}.result h1{font-family:Georgia,serif}</style></head><body><main><div class="result"><p class="eyebrow">CEE BEAUTY PRODUCT SHOP</p><h1>Checking your payment…</h1><p id="message">Please keep this page open while we verify your transaction securely.</p><p id="order"></p><a href="shop.html">Return to the shop</a></div></main><script>const ref=new URLSearchParams(location.search).get('reference');const msg=document.getElementById('message');const title=document.querySelector('h1');if(!ref){title.textContent='Payment reference not found';msg.textContent='Please contact Cee Beauty with your order details.';}else fetch('/api/verify-payment?reference='+encodeURIComponent(ref)).then(r=>r.json()).then(d=>{if(d.paid){title.textContent='Payment confirmed';msg.textContent='Thank you. Your payment has been verified.';document.getElementById('order').innerHTML='Order number: '+d.order_number+'<br><a href="order-status.html">Track your order ↗</a>';}else{title.textContent='Payment not yet confirmed';msg.textContent='Your payment is not marked successful yet. Please contact Cee Beauty before trying again.';}}).catch(()=>{title.textContent='Unable to verify right now';msg.textContent='Please contact Cee Beauty and share your payment reference.';});</script></body></html>
