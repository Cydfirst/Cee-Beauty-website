<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#171316"><title>Track your order | The Cee Beauty Shop</title><link rel="stylesheet" href="style.css"><style>.track-wrap{max-width:680px;margin:8vh auto;padding:28px}.track-card{background:#fff;border:1px solid #eadde2;padding:28px;box-shadow:0 12px 34px #24151d0b}.track-card label{display:block;font-size:12px;margin:14px 0 6px}.track-card input{width:100%;padding:13px;border:1px solid #e2d4da;font:inherit}.track-card button{margin-top:18px}.track-result{margin-top:18px;padding:16px;background:#fbf2f6}.track-result h2{font:500 24px Georgia,serif}.track-muted{color:#806c76;font-size:12px}</style></head><body><header class="site-header"><a class="brand brand-wordmark" href="index.html"><span class="brand-name">Cee Beauty <small>AESTHETICS</small></span></a><div class="header-actions"><a class="header-bag" href="shop.html">SHOP</a><button class="menu-toggle" id="menuToggle" aria-label="Open navigation" aria-expanded="false">MENU ☰</button></div><nav id="navMenu"><a href="index.html">Home</a><a href="shop.html">The Cee Beauty Shop</a><a href="services.html">Appointments</a></nav></header><main class="track-wrap"><p class="eyebrow">ORDER UPDATES</p><h1 style="font:500 clamp(38px,6vw,54px) Georgia,serif">Track your order.</h1><p class="track-muted">Enter the order number from your confirmation and the email address used at checkout.</p><form id="trackForm" class="track-card"><label for="trackOrder">Order number</label><input id="trackOrder" required placeholder="CEE-20261122-ABC123"><label for="trackEmail">Checkout email</label><input id="trackEmail" type="email" required placeholder="you@example.com"><button class="button button-dark" type="submit">Check order status</button><div id="trackResult" aria-live="polite"></div></form></main><script src="script.js"></script><script>
const form=document.getElementById('trackForm'),result=document.getElementById('trackResult');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const labels={order_received:'Order received',processing_sourcing:'Processing / sourcing',packaged:'Packaged',dispatched:'Dispatched',delivered:'Delivered',cancelled:'Cancelled'};form.addEventListener('submit',async e=>{e.preventDefault();result.className='track-result';result.textContent='Checking your order…';try{const u='/api/order-status?order='+encodeURIComponent(document.getElementById('trackOrder').value.trim())+'&email='+encodeURIComponent(document.getElementById('trackEmail').value.trim());const r=await fetch(u),d=await r.json();if(!r.ok)throw new Error(d.error||'Could not find your order.');result.innerHTML=`<h2>${esc(labels[d.order.status]||d.order.status)}</h2><p>Order: <strong>${esc(d.order.number)}</strong></p><p>Items: ${(d.order.items||[]).map(x=>`${esc(x.item_name)} × ${Number(x.quantity)||1}`).join(', ')}</p><p class="track-muted">Thank you for shopping with The Cee Beauty Shop.</p>`;}catch(err){result.textContent=err.message;}});
</script></body></html>
